name: Gold AI Trader - Daily Audit

on:
  schedule:
    - cron: '0 17 * * 1-5'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Run daily Claude audit
        run: |
          curl -X POST "https://gold-ai-trader-navy.vercel.app/api/audit" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
