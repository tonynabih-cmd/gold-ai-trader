name: 10-Minute Fallback Trigger

on:
  schedule:
    # 10-Minute Backup Trigger (Official GitHub limit)
    - cron: '*/10 * * * 1-5'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit Vercel Cron Endpoint
        run: |
          curl -s -X GET "${{ secrets.BOT_URL }}/api/cron" \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
