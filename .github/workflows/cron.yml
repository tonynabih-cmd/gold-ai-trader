name: 5-Minute Trigger

on:
  schedule:
    # Equivalent 5-minute weekday schedule; changing the cron syntax reactivates
    # a GitHub scheduled workflow if it was auto-disabled after inactivity.
    - cron: '0/5 * * * 1-5'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      BOT_URL: ${{ secrets.BOT_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Hit Vercel Cron Endpoint
        run: |
          curl -fsS \
            -X GET "${BOT_URL}/api/cron" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "User-Agent: GitHub-Actions-Cron"
