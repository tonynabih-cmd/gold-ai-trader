name: 10-Minute Fallback Trigger

on:
  schedule:
    # Runs every 10 minutes on weekdays (Monday through Friday)
    - cron: '*/1 * * * 1-5'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit Vercel Cron Endpoint
        run: |
          curl -s -X GET "${{ secrets.BOT_URL }}/api/cron" \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
